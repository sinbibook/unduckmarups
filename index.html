<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>강릉 언덕마루 펜션 - 홈</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="강릉 언덕마루 펜션 - 홈" />
  <meta property="og:description" content="강릉 경포대에 위치한 오션뷰펜션, 언덕마루 펜션입니다. 순긋해변 도보 2분으로 가족, 커플과 함께 낭만적인 시간을 보내보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/23/TIxjHlP2Zs3c.jpg" />
  <meta property="og:url" content="https://unduckmarups.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="강릉 언덕마루 펜션 - 홈" />
  <meta name="twitter:description" content="강릉 경포대에 위치한 오션뷰펜션, 언덕마루 펜션입니다. 순긋해변 도보 2분으로 가족, 커플과 함께 낭만적인 시간을 보내보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/23/TIxjHlP2Zs3c.jpg" />
  <meta name="naver-site-verification" content="9131fe3cf6f8fa36b99c6159301b6bf1fcf9b973" />
  <meta name="google-site-verification" content="koySCqlNVAKoMURhMSKuw2pGAD5RYzN6n5nP3wt8rRM" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="main">
          <!-- ── 히어로 (hero) ────────────────────────────────── -->
          <div class="main_visual visual">
            <div class="visual_txt">
              <!-- 장식용 고정 문구. 대응하는 데이터 필드가 없어 매핑하지 않는다 -->
              <span>WELCOME TO PENSION</span>
              <strong data-index-hero-title></strong>
              <p data-index-hero-description></p>
            </div>
            <div class="arw_box">
              <div
                class="swiper-button-prev"
                style="
                  background: url(images/common/left_btn.png) no-repeat 0 0;
                  background-size: auto 100%;
                "
              ></div>
              <div
                class="swiper-button-next"
                style="
                  background: url(images/common/right_btn.png) no-repeat 100%;
                  background-size: auto 100%;
                "
              ></div>
            </div>
            <a href="#" class="scroll_down"><img src="images/common/scroll.png" alt="스크롤" /></a>
            <div class="visual_box">
              <div class="swiper-container">
                <div class="swiper-wrapper" data-index-hero-slides></div>
              </div>
            </div>
          </div>
          <!--// main_visual -->

          <!-- ── 부대시설 (property.facilities) ────────────────── -->
          <div class="main_special">
            <div class="title_box">
              <h3>SPECIAL</h3>
              <p data-index-special-description></p>
            </div>
            <div class="swiper-container inner">
              <div class="swiper-wrapper" data-index-special-slides></div>
            </div>
            <div class="arw_box">
              <div
                class="swiper-button-prev"
                style="background: url(images/common/room_pre.png) no-repeat 50% 50% #fff"
              >
                <img src="images/common/spe_le.png" alt="이전버튼" />
              </div>
              <div
                class="swiper-button-next"
                style="background: url(images/common/l_le.png) no-repeat 50% 50% #fff"
              >
                <img src="images/common/spe_ri.png" alt="다음버튼" />
              </div>
            </div>
          </div>
          <!--// main_special -->

          <!-- ── 객실 (customFields.roomtypes) ─────────────────── -->
          <div class="main_room">
            <div class="title_box">
              <h3>ROOMS LIST</h3>
              <p data-index-room-description></p>
            </div>
            <div class="room_list">
              <div class="swiper-container">
                <div class="swiper-wrapper" data-index-room-slides></div>
              </div>
              <div class="arw_box">
                <div
                  class="swiper-button-prev"
                  style="background: url(images/common/room_pre.png) no-repeat 25% 50% #fff"
                >
                  Prev
                </div>
                <div
                  class="swiper-button-next"
                  style="background: url(images/common/l_le.png) no-repeat 75% 50% #fff"
                >
                  Next
                </div>
              </div>
            </div>
          </div>
          <!--// main_room -->

          <!-- ── 전경 (essence + 외경 이미지) ──────────────────── -->
          <div class="main_landscape inner" data-index-landscape>
            <div class="title_box">
              <h3>LANDSCAPE</h3>
              <p data-index-landscape-lead></p>
            </div>
            <div class="landscape_box">
              <div class="img_box" data-index-landscape-image></div>
              <div class="txt_box">
                <strong data-index-landscape-title></strong>
                <p data-index-landscape-description></p>
                <a
                  href="./main.html"
                  class="btn_more"
                  style="background: url(images/common/spe_view.png) no-repeat 78% 50%"
                >
                  VIEW
                </a>
                <ul data-index-landscape-thumbs></ul>
              </div>
            </div>
          </div>
          <!--// main_landscape -->

          <!-- ── 예약 안내 (closing) ───────────────────────────── -->
          <div class="main_reserve">
            <div class="title_box">
              <h3>RESERVE INFO</h3>
              <p data-index-reserve-lead></p>
            </div>
            <div class="reserve_box inner">
              <div class="img_box" data-index-reserve-image></div>
              <div class="txt_box">
                <strong data-index-reserve-title></strong>
                <p data-index-reserve-description></p>
                <div class="btn_wrap">
                  <a
                    href="./reservation.html"
                    style="background: url(images/common/spe_view.png) no-repeat 78% 50%"
                  >
                    이용안내
                  </a>
                  <a
                    href="#!"
                    target="_blank"
                    data-booking-link
                    style="background: url(images/common/spe_view.png) no-repeat 78% 50%"
                  >
                    예약하기
                  </a>
                </div>
              </div>
            </div>
          </div>
          <!--// main_reserve -->
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/index-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/index.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
